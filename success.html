<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Goldtide Research</title>
<link rel="icon" type="image/png" href="assets/goldtide-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0a0b; --surface:#141416;
    --line: rgba(201,162,39,0.22);
    --gold:#c9a227; --gold-bright:#e8c468; --gold-dim:#7a6526;
    --bone:#ede6d6; --muted:#948c7c; --muted-2:#5c574c;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--void); color:var(--bone); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:40px; }
  a{ color:inherit; text-decoration:none; }
  .box{ max-width:480px; }
  .seal{ width:64px; height:64px; margin:0 auto 28px; border:1px solid var(--gold-dim); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .seal svg{ width:26px; height:26px; }
  .label{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.28em; font-size:0.72rem; color:var(--gold); margin-bottom:16px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:2rem; margin-bottom:16px; }
  p{ color:var(--muted); font-size:0.94rem; line-height:1.7; margin-bottom:32px; }
  .order-id{ font-family:'Oswald',sans-serif; font-size:0.72rem; letter-spacing:0.06em; color:var(--muted-2); text-transform:uppercase; margin-bottom:32px; }
  .btn{
    display:inline-block; font-family:'Oswald',sans-serif; letter-spacing:0.14em; text-transform:uppercase;
    font-size:0.76rem; padding:13px 26px; border:1px solid var(--gold); background:var(--gold); color:#0a0a0b;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="seal"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#e8c468" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="label">Order Received</span>
    <h1>Thank you for your order</h1>
    <p>We've received your order details. Once your Interac e-Transfer arrives, we'll confirm and get it shipped — you'll hear from us by email.</p>
    <p class="order-id" id="orderRef"></p>
    <a href="shop.html" class="btn">Continue Shopping →</a>
  </div>

  <script>
    // Cart is already cleared by checkout.html before redirecting here.
    localStorage.removeItem('goldtideCart');
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref');
    if (ref){
      document.getElementById('orderRef').textContent = 'Order Reference: ' + ref;
    }
  </script>
</body>
</html>
